name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            server/pnpm-lock.yaml
            client/pnpm-lock.yaml

      # Three pnpm projects, each with its own lockfile. HUSKY=0 skips
      # installing git hooks, which CI does not use.
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm -C server install --frozen-lockfile
          pnpm -C client install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Check formatting
        run: |
          pnpm -C server run format:check
          pnpm -C client run format:check

      - name: Typecheck
        run: |
          pnpm -C server run typecheck
          pnpm -C client run typecheck

      - name: Lint
        run: |
          pnpm -C server run lint
          pnpm -C client run lint

      - name: Build
        run: pnpm -C client run build
